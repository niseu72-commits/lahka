<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #fff;
            color: #202124;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 25px;
        }

        header a {
            color: rgba(0, 0, 0, 0.87);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        header a:hover {
            color: #1f1f1f;
            text-decoration: underline;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 92px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853, #EA4335, #4285F4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }

        .search-box {
            width: 100%;
            max-width: 584px;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .search-input:hover {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08), 0 1px 3px rgba(32, 33, 36, 0.05);
        }

        .search-input:focus {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: transparent;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 24px;
            cursor: pointer;
            transition: all 0.1s;
            font-family: Arial, sans-serif;
        }

        button:hover {
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        button:active {
            border: 1px solid #4285f4;
        }

        footer {
            background-color: #f2f2f2;
            padding: 15px 20px;
            font-size: 14px;
            color: #70757a;
        }

        .footer-country {
            padding: 15px 20px;
            border-bottom: 1px solid #dadce0;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            padding: 0 20px;
        }

        .footer-links a {
            color: #70757a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #4285f4;
        }

        .footer-left {
            float: left;
        }

        .footer-right {
            float: right;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 60px;
            }

            .search-box {
                max-width: 100%;
                padding: 0 20px;
            }

            header {
                gap: 15px;
                padding: 10px;
            }

            .footer-links {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#gmail">Gmail</a>
            <a href="#images">Images</a>
            <a href="#settings">⚙️</a>
            <a href="#signin">Sign in</a>
        </header>

        <main class="main">
            <div class="logo">Google</div>
            
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search Google or type a URL" autofocus>
            </div>

            <div class="buttons">
                <button onclick="search()">Google Search</button>
                <button onclick="luckySearch()">I'm Feeling Lucky</button>
            </div>
        </main>

        <footer>
            <div class="footer-country">United States</div>
            <div class="footer-links">
                <div class="footer-left">
                    <a href="#about">About</a>
                    <a href="#advertising">Advertising</a>
                    <a href="#business">Business</a>
                    <a href="#howtouse">How Search works</a>
                </div>
                <div class="footer-right">
                    <a href="#privacy">Privacy</a>
                    <a href="#terms">Terms</a>
                    <a href="#settings">Settings</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const searchInput = document.querySelector('.search-input');

        function search() {
            const query = searchInput.value;
            if (query) {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        function luckySearch() {
            const query = searchInput.value;
            if (query) {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}&btnI=1`;
            }
        }

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                search();
            }
        });
    </script>
</body>
</html>
